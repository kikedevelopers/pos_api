# =============================================================================
# POS API - Docker Compose de PRODUCCIÓN (full stack con TLS).
#
# Stack:
#   - postgres : DB con volumen persistente, sin puerto expuesto al host.
#   - api      : imagen pulleada del registry (${IMAGE_NAME}), corre migraciones
#                en su entrypoint, escucha en red interna.
#   - nginx    : reverse proxy 80/443 → api, con HSTS/headers de seguridad.
#                Reload periódico cada 6h para tomar nuevos certs.
#   - certbot  : renueva certificados Let's Encrypt cada 12h vía webroot.
#
# Usado por `./deploy.sh`. NO se invoca directamente salvo para debugging:
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f nginx
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pos_network

  api:
    image: ${IMAGE_NAME:-ghcr.io/CHANGEME/pos_api:latest}
    container_name: pos_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3010}
      API_PREFIX: ${API_PREFIX:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SYNCHRONIZE: 'false'
      DB_LOGGING: ${DB_LOGGING:-false}
      DB_SSL: 'false'
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      # tras nginx (1 hop): X-Forwarded-For real.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_OWNER: ${JWT_EXPIRES_OWNER:-7d}
      JWT_EXPIRES_EMPLOYEE: ${JWT_EXPIRES_EMPLOYEE:-1d}
      # Firmas asimétricas Ed25519 (paneles externos: kdevs-admin). Sin valor =
      # endpoints firmados deshabilitados (503). ADMIN_* = migration-import;
      # SUPERADMIN_* = módulo superadmin (privada solo en el navegador).
      ADMIN_SIGNING_PUBLIC_KEY: ${ADMIN_SIGNING_PUBLIC_KEY:-}
      ADMIN_SIGNATURE_MAX_SKEW_MS: ${ADMIN_SIGNATURE_MAX_SKEW_MS:-300000}
      SUPERADMIN_SIGNING_PUBLIC_KEY: ${SUPERADMIN_SIGNING_PUBLIC_KEY:-}
      SUPERADMIN_SIGNATURE_MAX_SKEW_MS: ${SUPERADMIN_SIGNATURE_MAX_SKEW_MS:-120000}
      # Respaldos de la BD → Google Cloud Storage. Sin GCS_BACKUP_BUCKET el
      # módulo queda deshabilitado (el panel lo avisa). En esta VM NO hacen
      # falta credenciales: con GCS_CREDENTIALS_MODE=auto y NODE_ENV=production
      # el SDK usa la identidad de la propia máquina (ADC). Las variables
      # GCS_CREDENTIALS_* solo se rellenan si la VM no tiene service account.
      GCS_BACKUP_BUCKET: ${GCS_BACKUP_BUCKET:-}
      GCS_BACKUP_PREFIX: ${GCS_BACKUP_PREFIX:-backups}
      GCS_CREDENTIALS_MODE: ${GCS_CREDENTIALS_MODE:-auto}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON:-}
      GCS_CREDENTIALS_FILE: ${GCS_CREDENTIALS_FILE:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      # Retención, cron diario (medianoche Colombia) y tope del volcado.
      BACKUP_MAX_FILES: ${BACKUP_MAX_FILES:-7}
      BACKUP_CRON_ENABLED: ${BACKUP_CRON_ENABLED:-true}
      BACKUP_TIMEOUT_MS: ${BACKUP_TIMEOUT_MS:-600000}
      # Vacío = pg_dump del PATH (la imagen ya trae postgresql18-client).
      PG_DUMP_BIN: ${PG_DUMP_BIN:-}
    # Sin `ports:` — el acceso externo solo va por nginx (80/443).
    expose:
      - '${PORT:-3010}'
    networks:
      - pos_network

  # Frontend PWA (SPA estático). Imagen construida por el repo placepos_pwa_app
  # y publicada en GHCR. Sirve los estáticos en HTTP interno (puerto 80, sin TLS
  # ni puerto publicado); el edge nginx termina TLS y le hace reverse-proxy en
  # ${PWA_DOMAIN}.
  pwa:
    image: ${PWA_IMAGE_NAME:-ghcr.io/CHANGEME/placepos_pwa_app:latest}
    container_name: placepos_pwa
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - pos_network

  nginx:
    image: nginx:1.27-alpine
    container_name: pos_api_nginx
    restart: unless-stopped
    depends_on:
      - api
      - pwa
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      PWA_DOMAIN: ${PWA_DOMAIN}
      RELEASES_DOMAIN: ${RELEASES_DOMAIN}
      API_PORT: ${PORT:-3010}
      # Limita envsubst a estas variables — el resto de `$var` en el config
      # nginx (ej: $host, $request_uri) NO se intentan sustituir.
      NGINX_ENVSUBST_TEMPLATE_VARS: 'DOMAIN,API_PORT,PWA_DOMAIN,RELEASES_DOMAIN'
    volumes:
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Instalables servidos en ${RELEASES_DOMAIN}. Los sube el action de
      # placepos por SCP a ./releases (host); nginx los sirve como estáticos.
      - ./releases:/var/www/releases:ro
    # Recarga nginx cada 6h para tomar el cert recién renovado por certbot.
    # `daemon off` mantiene el contenedor vivo en foreground.
    #
    # OJO: llamamos a `/docker-entrypoint.sh` explícitamente porque sólo corre
    # los scripts de /docker-entrypoint.d/ (incluyendo `envsubst-on-templates`)
    # cuando $1 == "nginx". Si pusiéramos directamente `/bin/sh -c ...` como
    # antes, los templates NO se procesan y nginx arranca con la config default
    # de la imagen → 404 en todo, incluido el challenge ACME.
    command: >
      /bin/sh -c "/docker-entrypoint.sh nginx -g 'daemon off;' & NGINX_PID=$$!; (while :; do sleep 6h & wait $${!}; nginx -s reload 2>/dev/null || true; done) & wait $$NGINX_PID"
    networks:
      - pos_network

  certbot:
    image: certbot/certbot:latest
    container_name: pos_api_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Intenta renovar cada 12h. Let's Encrypt solo renueva si quedan <30 días
    # de validez, así que la mayoría de las veces es un no-op barato.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
    networks:
      - pos_network

volumes:
  pos_postgres_data:
    name: pos_api_postgres_data

networks:
  pos_network:
    name: pos_api_network
    driver: bridge
